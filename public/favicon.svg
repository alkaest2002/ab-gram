<!--
  The header lockup reduced to its block: a rounded square split blue/red with
  a tight white "AB" laid across the seam, so each letter is cut by the other
  colour. Webfonts are not available to an icon, so this names a common bold
  grotesque and falls back to the system sans — at 32px and below only the
  weight and the split are legible anyway. No "Gram": it disappears below 24px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="round">
      <rect width="32" height="32" rx="5" />
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="16" height="32" fill="#2563eb" />
    <rect x="16" width="16" height="32" fill="#dc2626" />
    <g
      fill="#ffffff"
      font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
      font-weight="700"
      font-size="24"
      text-anchor="middle"
    >
      <text x="9" y="16" dy="0.35em">A</text>
      <text x="23" y="16" dy="0.35em">B</text>
    </g>
  </g>
</svg>
